services:
  - type: web
    name: watch-party-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: watch-party-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: watch-party-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: watch-party-api
          envVarKey: RENDER_EXTERNAL_URL
